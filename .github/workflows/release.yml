# Releases nanoui-controls when a version tag (v0.2.0) is pushed: checks
# that the tag is the version in build.zig.zon and is on main, runs the
# tests, and creates the GitHub release with the version's section of
# CHANGELOG.md as its notes, unless the release already exists. A tag
# with a hyphen (v0.2.0-rc.1) makes a prerelease.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check the version and write the notes
        run: tools/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: zig build test --summary all
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "nanoui-controls ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" $flags
