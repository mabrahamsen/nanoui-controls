# Checks the formatting, runs the tests, and builds the docs and the
# example on macOS, Linux and Windows on every push to main and every
# pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig fmt --check build.zig build.zig.zon src examples
      - run: zig build test --summary all
      - run: zig build docs
      - run: zig build
